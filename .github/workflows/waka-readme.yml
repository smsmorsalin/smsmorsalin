name: Update WakaTime Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-readme:
    name: Update Coding Activity
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - id: update-wakatime
        uses: athul/waka-readme@v0.2.5
        continue-on-error: true
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          TIME_RANGE: last_7_days
          LANG_COUNT: 6
          SHOW_TIME: true
          SHOW_TOTAL: true
          BLOCKS: "░▒▓█"

      - name: WakaTime update skipped
        if: steps.update-wakatime.outcome == 'failure'
        run: echo "::warning::WakaTime API returned 403/forbidden; skipping README coding activity update for this run."
